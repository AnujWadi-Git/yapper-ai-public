<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yapper AI</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #17202a;
    }

    .app {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0;
      color: #52616f;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #52616f;
    }

    .layout {
      display: grid;
      grid-template-columns: 220px 1fr 320px;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: #ffffff;
      border: 1px solid #d9e1e8;
      border-radius: 8px;
      padding: 16px;
    }

    /* --- Cold-start / connecting banner --- */

    .boot-banner {
      display: none;
      align-items: center;
      gap: 10px;
      background: #fff6e0;
      border: 1px solid #e9d38f;
      color: #6b5518;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .boot-banner.visible {
      display: flex;
    }

    /* --- Auth screen --- */

    .auth-screen {
      display: none;
      max-width: 380px;
      margin: 48px auto;
    }

    .auth-screen.visible {
      display: block;
    }

    .auth-screen h2 {
      margin-top: 0;
    }

    .auth-field {
      margin-bottom: 12px;
    }

    .auth-field label {
      display: block;
      font-size: 13px;
      color: #52616f;
      margin-bottom: 4px;
    }

    .auth-field input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #c8d2dc;
      border-radius: 8px;
      font-size: 15px;
    }

    .auth-error {
      color: #a33;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 8px;
    }

    .auth-switch {
      margin-top: 14px;
      font-size: 14px;
      color: #52616f;
    }

    .auth-switch a {
      color: #1f7a8c;
      cursor: pointer;
      text-decoration: underline;
    }

    /* --- Main app (hidden until authenticated) --- */

    .main-app {
      display: none;
    }

    .main-app.visible {
      display: block;
    }

    /* --- Conversation sidebar --- */

    .sidebar h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .new-chat-btn {
      width: 100%;
      margin-bottom: 10px;
      background: #34495e;
    }

    .conversation-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 480px;
      overflow-y: auto;
    }

    .conversation-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13.5px;
      color: #34495e;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conversation-item:hover {
      background: #eef2f5;
    }

    .conversation-item.active {
      background: #dff2ff;
      color: #17202a;
    }

    .conversation-empty {
      color: #93a1ac;
      font-size: 13px;
    }

    .chat-box {
      min-height: 360px;
      max-height: 520px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .message {
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .message.loading {
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }

    .message.loading::after {
      content: "";
      width: 14px;
      height: 14px;
      border: 2px solid #9aa8b4;
      border-top-color: #1f7a8c;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
    }

    .user {
      align-self: flex-end;
      background: #dff2ff;
      max-width: 82%;
    }

    .bot {
      align-self: flex-start;
      background: #eef2f5;
      max-width: 82%;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #c8d2dc;
      border-radius: 8px;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.4;
      min-height: 48px;
      max-height: 180px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 16px;
      cursor: pointer;
      background: #1f7a8c;
      color: white;
      min-height: 44px;
    }

    button.secondary {
      background: #34495e;
    }

    button.link {
      background: transparent;
      color: #1f7a8c;
      min-height: auto;
      padding: 4px 8px;
      font-size: 13px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .avatar {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 8px;
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.22), transparent 34%),
        linear-gradient(145deg, #16293a, #273949 58%, #ead8bf);
      border: 1px solid #d9e1e8;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .portrait {
      width: 82%;
      height: 92%;
      position: relative;
      display: grid;
      justify-items: center;
      align-items: end;
    }

    .shoulders {
      width: 78%;
      height: 26%;
      border-radius: 46% 46% 0 0;
      background: linear-gradient(145deg, #315b78, #1e3e59);
      position: absolute;
      bottom: 0;
      box-shadow: 0 -8px 18px rgba(0, 0, 0, 0.14);
    }

    .neck {
      width: 25%;
      height: 20%;
      border-radius: 0 0 999px 999px;
      background: #c98f6f;
      position: absolute;
      bottom: 18%;
      z-index: 1;
    }

    .ear {
      width: 12%;
      height: 18%;
      border-radius: 999px;
      background: #d8a07d;
      position: absolute;
      top: 34%;
      z-index: 1;
    }

    .ear.left {
      left: 18%;
    }

    .ear.right {
      right: 18%;
    }

    .hair {
      width: 58%;
      height: 49%;
      border-radius: 48% 48% 38% 38%;
      background: linear-gradient(145deg, #202532, #10151f);
      position: absolute;
      top: 8%;
      z-index: 1;
      box-shadow: inset 0 10px 0 rgba(255, 255, 255, 0.04);
    }

    .hair::before {
      content: "";
      width: 56%;
      height: 25%;
      border-radius: 999px 999px 60% 60%;
      background: #10151f;
      position: absolute;
      left: 3%;
      top: 2%;
      transform: rotate(-10deg);
    }

    .face {
      width: 52%;
      height: 58%;
      border-radius: 44% 44% 48% 48%;
      background: linear-gradient(145deg, #e2ad8a, #c98f6f);
      position: relative;
      margin-bottom: 24%;
      z-index: 2;
      box-shadow:
        inset 0 -10px 0 rgba(0, 0, 0, 0.05),
        0 16px 24px rgba(0, 0, 0, 0.16);
      transition: transform 180ms ease;
    }

    .eye {
      width: 9%;
      height: 8%;
      border-radius: 50%;
      background: #101823;
      position: absolute;
      top: 40%;
    }

    .eye.left {
      left: 29%;
    }

    .eye.right {
      right: 29%;
    }

    .eyebrow {
      width: 18%;
      height: 3%;
      border-radius: 999px;
      background: #18202b;
      position: absolute;
      top: 32%;
      transition: transform 180ms ease;
    }

    .eyebrow.left {
      left: 24%;
    }

    .eyebrow.right {
      right: 24%;
    }

    .nose {
      width: 7%;
      height: 17%;
      border-radius: 999px;
      border-right: 3px solid rgba(94, 52, 35, 0.28);
      position: absolute;
      left: 46%;
      top: 43%;
    }

    .mouth {
      width: 25%;
      height: 5%;
      border-radius: 0 0 999px 999px;
      background: #7f2637;
      position: absolute;
      left: 37.5%;
      top: 68%;
      transition: all 120ms ease;
      overflow: hidden;
    }

    .mouth::after {
      content: "";
      width: 100%;
      height: 40%;
      background: rgba(255, 152, 158, 0.72);
      border-radius: 999px 999px 0 0;
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .avatar.speaking .face {
      animation: talkHead 900ms ease-in-out infinite;
    }

    .avatar.speaking .mouth {
      animation: talkMouth 260ms ease-in-out infinite;
    }

    .avatar.happy .mouth {
      height: 8%;
      border-radius: 0 0 999px 999px;
      top: 67%;
    }

    .avatar.thinking .mouth {
      width: 18%;
      height: 3%;
      left: 41%;
      top: 70%;
      border-radius: 999px;
    }

    .avatar.thinking .eyebrow.left {
      transform: rotate(-10deg) translateY(-3px);
    }

    .avatar.thinking .eyebrow.right {
      transform: rotate(10deg) translateY(-3px);
    }

    .avatar.serious .mouth {
      height: 3%;
      border-radius: 999px;
      top: 70%;
    }

    .avatar.excited .face {
      transform: scale(1.03);
    }

    .avatar.excited .mouth {
      width: 30%;
      height: 11%;
      left: 35%;
      top: 65%;
      border-radius: 0 0 999px 999px;
    }

    @keyframes talkMouth {
      0%, 100% {
        height: 4%;
        top: 69%;
      }
      50% {
        height: 14%;
        top: 63%;
      }
    }

    @keyframes talkHead {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2%);
      }
    }

    .status {
      margin-top: 12px;
      min-height: 22px;
      color: #52616f;
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status.hidden {
      display: none;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #c8d2dc;
      border-top-color: #1f7a8c;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
      flex: 0 0 auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        order: 3;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topbar">
      <div>
        <h1>Yapper AI</h1>
        <p class="subtitle">Type or talk. Yapper replies and speaks using your browser's voice.</p>
      </div>
      <div id="account" class="account" style="display: none;">
        <span id="accountEmail"></span>
        <button id="logoutButton" class="link">Log out</button>
      </div>
    </div>

    <div id="bootBanner" class="boot-banner">
      <span class="spinner"></span>
      <span id="bootBannerText">Connecting to Yapper...</span>
    </div>

    <!-- Auth screen: shown until a session cookie is confirmed -->
    <section id="authScreen" class="auth-screen panel">
      <h2 id="authTitle">Log in</h2>
      <div id="authError" class="auth-error"></div>
      <div class="auth-field">
        <label for="authEmail">Email</label>
        <input id="authEmail" type="email" autocomplete="email" />
      </div>
      <div class="auth-field">
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" autocomplete="current-password" />
      </div>
      <button id="authSubmit" style="width: 100%;">Log in</button>
      <div class="auth-switch">
        <span id="authSwitchPrompt">Don't have an account?</span>
        <a id="authSwitchLink">Sign up</a>
      </div>
    </section>

    <!-- Main app: shown once authenticated -->
    <section id="mainApp" class="main-app">
      <div class="layout">
        <aside class="panel sidebar">
          <h3>Conversations</h3>
          <button id="newChatButton" class="new-chat-btn">+ New chat</button>
          <div id="conversationList" class="conversation-list">
            <div class="conversation-empty">No conversations yet.</div>
          </div>
        </aside>

        <div class="panel">
          <div id="chatBox" class="chat-box"></div>

          <div class="controls">
            <textarea id="messageInput" placeholder="Say something to Yapper... Use Shift+Enter for a new line."></textarea>
            <button id="sendButton">Send</button>
            <button id="micButton" class="secondary">Mic</button>
          </div>
        </div>

        <aside class="panel">
          <div id="avatar" class="avatar happy" aria-label="Animated Yapper human avatar">
            <div class="portrait">
              <div class="shoulders"></div>
              <div class="neck"></div>
              <div class="ear left"></div>
              <div class="ear right"></div>
              <div class="hair"></div>
              <div class="face">
                <div class="eyebrow left"></div>
                <div class="eyebrow right"></div>
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="nose"></div>
                <div class="mouth"></div>
              </div>
            </div>
          </div>
          <div id="chatStatus" class="status hidden"></div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const bootBanner = document.getElementById("bootBanner");
    const bootBannerText = document.getElementById("bootBannerText");
    const authScreen = document.getElementById("authScreen");
    const authTitle = document.getElementById("authTitle");
    const authError = document.getElementById("authError");
    const authEmail = document.getElementById("authEmail");
    const authPassword = document.getElementById("authPassword");
    const authSubmit = document.getElementById("authSubmit");
    const authSwitchPrompt = document.getElementById("authSwitchPrompt");
    const authSwitchLink = document.getElementById("authSwitchLink");
    const account = document.getElementById("account");
    const accountEmail = document.getElementById("accountEmail");
    const logoutButton = document.getElementById("logoutButton");
    const mainApp = document.getElementById("mainApp");
    const newChatButton = document.getElementById("newChatButton");
    const conversationList = document.getElementById("conversationList");
    const chatBox = document.getElementById("chatBox");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const micButton = document.getElementById("micButton");
    const avatar = document.getElementById("avatar");
    const chatStatus = document.getElementById("chatStatus");

    let authMode = "login"; // or "signup"
    let currentConversationId = null;
    let availableVoices = [];

    // ---------- Voice (browser SpeechSynthesis only -- no server TTS cost) ----------

    function loadVoices() {
      if (!("speechSynthesis" in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
    }

    loadVoices();
    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    // Curated fallback, best quality first, used only if no voice matches
    // the quality-keyword scan below (e.g. an older/plainer browser voice list).
    const PREFERRED_VOICE_NAMES = [
      "Samantha", "Ava", "Allison", "Karen", "Moira", "Daniel", "Alex",
      "Google US English", "Microsoft Aria", "Microsoft Jenny", "Microsoft Guy"
    ];

    // Most browsers label their best-quality voices with one of these terms
    // (Edge/Chrome's "Online (Natural)" voices, Safari's enhanced/premium
    // voices, etc.) -- prefer those over a same-named "compact" voice.
    const QUALITY_KEYWORDS = ["natural", "neural", "premium", "enhanced", "studio"];

    function voiceScore(voice) {
      const name = voice.name.toLowerCase();
      let score = 0;
      if (QUALITY_KEYWORDS.some((keyword) => name.includes(keyword))) score += 10;
      const preferredIndex = PREFERRED_VOICE_NAMES.findIndex((n) => voice.name.includes(n));
      if (preferredIndex !== -1) score += PREFERRED_VOICE_NAMES.length - preferredIndex;
      if (voice.lang === "en-US") score += 2;
      else if (voice.lang.startsWith("en")) score += 1;
      if (voice.localService) score += 1; // local voices have less playback latency
      return score;
    }

    function pickVoice() {
      if (!availableVoices.length) return null;
      return availableVoices.reduce((best, voice) =>
        voiceScore(voice) > voiceScore(best) ? voice : best
      );
    }

    function cleanTextForSpeech(text) {
      return text
        .replace(/```[\s\S]*?```/g, "I wrote a code block on screen.")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/https?:\/\/\S+/g, "a link")
        .replace(/[\p{Emoji_Presentation}\p{Extended_Pictographic}]/gu, "")
        .replace(/[•#>*_~]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Chrome silently stops mid-utterance on long text, so long replies are
    // split into sentence-sized chunks and spoken back to back instead of
    // being handed to speechSynthesis as one long string.
    const SPEECH_CHUNK_MAX_CHARS = 200;

    function chunkForSpeech(text) {
      const sentences = text.match(/[^.!?]+[.!?]+(\s+|$)|[^.!?]+$/g) || [text];
      const chunks = [];
      let current = "";

      for (const sentence of sentences) {
        if (current && (current + sentence).length > SPEECH_CHUNK_MAX_CHARS) {
          chunks.push(current.trim());
          current = "";
        }
        current += sentence;
      }
      if (current.trim()) chunks.push(current.trim());
      return chunks;
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      const speechText = cleanTextForSpeech(text);
      if (!speechText) return;

      window.speechSynthesis.cancel();
      const voice = pickVoice();
      const chunks = chunkForSpeech(speechText);

      const speakChunk = (index) => {
        if (index >= chunks.length) {
          avatar.classList.remove("speaking");
          return;
        }
        const utterance = new SpeechSynthesisUtterance(chunks[index]);
        if (voice) utterance.voice = voice;
        utterance.rate = 0.9;
        utterance.pitch = 1.03;
        utterance.volume = 1;
        utterance.onstart = () => avatar.classList.add("speaking");
        utterance.onend = () => speakChunk(index + 1);
        utterance.onerror = () => speakChunk(index + 1);
        window.speechSynthesis.speak(utterance);
      };

      speakChunk(0);
    }

    function setExpression(text) {
      const lower = text.toLowerCase();
      avatar.classList.remove("happy", "thinking", "serious", "excited");

      if (/[?!]{2,}/.test(text) || lower.includes("awesome") || lower.includes("great")) {
        avatar.classList.add("excited");
      } else if (lower.includes("sorry") || lower.includes("error") || lower.includes("can't") || lower.includes("cannot")) {
        avatar.classList.add("serious");
      } else if (lower.includes("maybe") || lower.includes("let's think") || lower.includes("question")) {
        avatar.classList.add("thinking");
      } else {
        avatar.classList.add("happy");
      }
    }

    function setChatStatus(text) {
      if (!text) {
        chatStatus.className = "status hidden";
        chatStatus.textContent = "";
        return;
      }
      chatStatus.className = "status";
      chatStatus.textContent = text;
    }

    // ---------- Chat rendering ----------

    function addMessage(text, className) {
      const message = document.createElement("div");
      message.className = `message ${className}`;
      message.textContent = text;
      chatBox.appendChild(message);
      chatBox.scrollTop = chatBox.scrollHeight;
      return message;
    }

    function clearChat() {
      chatBox.innerHTML = "";
    }

    function renderHistory(messages) {
      clearChat();
      if (!messages.length) {
        addMessage("Hey, I'm Yapper AI. What's on your mind?", "bot");
        setExpression("Hey, I'm Yapper AI. What's on your mind?");
        return;
      }
      for (const message of messages) {
        addMessage(message.content, message.role === "user" ? "user" : "bot");
      }
      setExpression(messages[messages.length - 1].content);
    }

    // ---------- Conversations ----------

    async function loadConversations() {
      try {
        const response = await fetch("/conversations", { credentials: "same-origin" });
        if (!response.ok) return;
        const items = await response.json();
        renderConversationList(items);
      } catch (error) {
        // Non-fatal -- the sidebar just stays empty/stale.
      }
    }

    function renderConversationList(items) {
      conversationList.innerHTML = "";
      if (!items.length) {
        conversationList.innerHTML = '<div class="conversation-empty">No conversations yet.</div>';
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "conversation-item" + (item.id === currentConversationId ? " active" : "");
        row.textContent = item.title;
        row.title = item.title;
        row.addEventListener("click", () => openConversation(item.id));
        conversationList.appendChild(row);
      }
    }

    async function openConversation(conversationId) {
      currentConversationId = conversationId;
      try {
        const response = await fetch(`/conversations/${conversationId}/messages`, { credentials: "same-origin" });
        if (!response.ok) {
          addMessage("Could not load that conversation.", "bot");
          return;
        }
        const messages = await response.json();
        renderHistory(messages);
        await loadConversations(); // refresh active-row highlighting
      } catch (error) {
        addMessage("Network error loading that conversation.", "bot");
      }
    }

    function startNewChat() {
      currentConversationId = null;
      clearChat();
      addMessage("Hey, I'm Yapper AI. What's on your mind?", "bot");
      setExpression("Hey, I'm Yapper AI. What's on your mind?");
      loadConversations();
    }

    // ---------- Sending messages ----------

    async function sendMessage(textFromMic) {
      const text = (textFromMic || messageInput.value).trim();
      if (!text) return;

      addMessage(text, "user");
      messageInput.value = "";
      sendButton.disabled = true;
      micButton.disabled = true;
      const thinkingMessage = addMessage("Yapper is thinking...", "bot loading");

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 130000);

        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          signal: controller.signal,
          body: JSON.stringify({
            text,
            conversation_id: currentConversationId
          })
        });
        clearTimeout(timeoutId);

        if (response.status === 401) {
          thinkingMessage.remove();
          showAuthScreen("Your session expired. Please log in again.");
          return;
        }

        const data = await response.json();
        thinkingMessage.remove();

        if (response.status === 429) {
          addMessage(data.detail || "Yapper is getting a lot of messages right now. Please wait a bit.", "bot");
          return;
        }

        if (!response.ok) {
          addMessage(data.detail || "Something went wrong.", "bot");
          return;
        }

        const reply = data.reply || data.text || "";
        const isNewConversation = !currentConversationId;
        currentConversationId = data.conversation_id || currentConversationId;

        addMessage(reply, "bot");
        if (Array.isArray(data.tools_used) && data.tools_used.length) {
          const badge = document.createElement("div");
          badge.className = "message bot";
          badge.style.cssText = "opacity:0.7;font-size:0.78rem;font-style:italic;padding-top:0;";
          badge.textContent = "\u{1F527} used: " + data.tools_used.join(", ");
          chatBox.appendChild(badge);
          chatBox.scrollTop = chatBox.scrollHeight;
        }

        setExpression(reply);
        speak(reply);

        if (isNewConversation) {
          await loadConversations();
        }
      } catch (error) {
        thinkingMessage.remove();
        if (error.name === "AbortError") {
          addMessage("That took too long. Try a shorter prompt or send it in smaller chunks.", "bot");
        } else {
          addMessage("Network error. Is the server reachable?", "bot");
        }
      } finally {
        sendButton.disabled = false;
        micButton.disabled = false;
        messageInput.focus();
      }
    }

    function startMic() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("Speech recognition is not supported in this browser. Try Chrome.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      micButton.textContent = "Listening...";
      micButton.disabled = true;

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        sendMessage(transcript);
      };
      recognition.onerror = () => {
        alert("Could not hear you clearly. Try again.");
      };
      recognition.onend = () => {
        micButton.textContent = "Mic";
        micButton.disabled = false;
      };

      recognition.start();
    }

    sendButton.addEventListener("click", () => sendMessage());
    micButton.addEventListener("click", startMic);
    newChatButton.addEventListener("click", startNewChat);
    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    // ---------- Auth ----------

    function setAuthMode(mode) {
      authMode = mode;
      authError.textContent = "";
      if (mode === "login") {
        authTitle.textContent = "Log in";
        authSubmit.textContent = "Log in";
        authSwitchPrompt.textContent = "Don't have an account?";
        authSwitchLink.textContent = "Sign up";
      } else {
        authTitle.textContent = "Sign up";
        authSubmit.textContent = "Sign up";
        authSwitchPrompt.textContent = "Already have an account?";
        authSwitchLink.textContent = "Log in";
      }
    }

    authSwitchLink.addEventListener("click", () => {
      setAuthMode(authMode === "login" ? "signup" : "login");
    });

    async function submitAuth() {
      const email = authEmail.value.trim();
      const password = authPassword.value;
      authError.textContent = "";

      if (!email || !password) {
        authError.textContent = "Email and password are required.";
        return;
      }

      authSubmit.disabled = true;
      const endpoint = authMode === "login" ? "/auth/login" : "/auth/signup";

      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify({ email, password })
        });
        const data = await response.json();

        if (!response.ok) {
          if (response.status === 429) {
            authError.textContent = "Too many attempts. Please wait a few minutes and try again.";
          } else {
            authError.textContent = data.detail || "Something went wrong.";
          }
          return;
        }

        authPassword.value = "";
        await enterApp(data.email);
      } catch (error) {
        authError.textContent = "Network error. Please try again.";
      } finally {
        authSubmit.disabled = false;
      }
    }

    authSubmit.addEventListener("click", submitAuth);
    authPassword.addEventListener("keydown", (event) => {
      if (event.key === "Enter") submitAuth();
    });

    logoutButton.addEventListener("click", async () => {
      await fetch("/auth/logout", { method: "POST", credentials: "same-origin" });
      showAuthScreen();
    });

    function showAuthScreen(message) {
      mainApp.classList.remove("visible");
      account.style.display = "none";
      authScreen.classList.add("visible");
      authError.textContent = message || "";
      setAuthMode("login");
    }

    async function enterApp(email) {
      authScreen.classList.remove("visible");
      account.style.display = "flex";
      accountEmail.textContent = email;
      mainApp.classList.add("visible");
      currentConversationId = null;
      addMessage("Hey, I'm Yapper AI. What's on your mind?", "bot");
      setExpression("Hey, I'm Yapper AI. What's on your mind?");
      await loadConversations();
    }

    // ---------- Boot: check session, show cold-start banner if slow ----------

    async function boot() {
      const slowTimer = setTimeout(() => {
        bootBannerText.textContent =
          "Still connecting... the free-tier server may be waking up from sleep (can take up to a minute).";
        bootBanner.classList.add("visible");
      }, 2500);

      try {
        const response = await fetch("/auth/me", { credentials: "same-origin" });
        clearTimeout(slowTimer);
        bootBanner.classList.remove("visible");

        if (response.ok) {
          const data = await response.json();
          await enterApp(data.email);
        } else {
          showAuthScreen();
        }
      } catch (error) {
        clearTimeout(slowTimer);
        bootBannerText.textContent = "Could not reach the server. Please refresh the page.";
        bootBanner.classList.add("visible");
        showAuthScreen();
      }
    }

    boot();
  </script>
</body>
</html>
